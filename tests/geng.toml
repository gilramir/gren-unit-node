[application]
geng = "0.6.0 <= v < 0.7.0"
runtime = "node"

[dependencies]
"github.com/gilramir/gren-unit-node" = "1.1.0 <= v < 2.0.0"
"github.com/gilramir/gren-argparse" = "2.0.1 <= v < 3.0.0"
"github.com/geng-language/node" = "6.1.3 <= v < 7.0.0"
"github.com/geng-language/test" = "5.0.0 <= v < 6.0.0"
"github.com/geng-language/stream" = "0.1.0 <= v < 0.2.0"

[sources]
"github.com/gilramir/gren-unit-node" = { path = ".." }
"github.com/gilramir/gren-argparse" = { path = "../../gren-argparse" }
"github.com/geng-language/node" = { path = "../../../gren-lang/node" }
"github.com/geng-language/test" = { path = "../../../gren-lang/test" }
"github.com/geng-language/stream" = { path = "../../../../packages/stream" }
"github.com/geng-language/url" = { path = "../../../../packages/url" }
